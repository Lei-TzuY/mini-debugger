name: phase41-enum-patch2

on:
  push:
    branches: [feat/core-inline-enum-identity]
    paths: [.github/workflows/_phase41_enum_patch2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-inline-enum-identity
          fetch-depth: 0
      - name: Apply enum identity recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          local = Path('src/dwarf/local_value.hpp')
          s = local.read_text()
          old = '''inline std::optional<std::string_view> local_enum_symbol(const LocalScalarValue& value) {
            if (value.kind != LocalValueKind::Enumeration || !value.enum_type) {
              return std::nullopt;
            }
            for (const auto& enumerator : value.enum_type->enumerators) {
              if (enumerator.raw_value == value.raw_value) return enumerator.name;
            }
            return std::nullopt;
          }
          '''
          new = '''inline std::optional<std::string_view> local_enum_symbol(const LocalScalarValue& value) {
            if (value.kind != LocalValueKind::Enumeration || !value.enum_type) {
              return std::nullopt;
            }
            const LocalEnumEntry* match = nullptr;
            for (const auto& enumerator : value.enum_type->enumerators) {
              if (enumerator.raw_value != value.raw_value) continue;
              if (match != nullptr) return std::nullopt;
              match = &enumerator;
            }
            return match == nullptr ? std::nullopt
                                    : std::optional<std::string_view>{match->name};
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'local enum helper matches={s.count(old)}')
          local.write_text(s.replace(old, new, 1))

          source = Path('src/dwarf/source_lookup.cpp')
          s = source.read_text()
          old = '''constexpr std::uint64_t kInlineDwTagArrayType = 0x01;
          constexpr std::uint64_t kInlineDwTagUnionType = 0x17;
          constexpr std::uint64_t kInlineDwTagSubrangeType = 0x21;
          '''
          new = '''constexpr std::uint64_t kInlineDwTagArrayType = 0x01;
          constexpr std::uint64_t kInlineDwTagEnumerationType = 0x04;
          constexpr std::uint64_t kInlineDwTagUnionType = 0x17;
          constexpr std::uint64_t kInlineDwTagSubrangeType = 0x21;
          constexpr std::uint64_t kInlineDwTagEnumerator = 0x28;
          constexpr std::uint64_t kInlineDwAtConstValue = 0x1c;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'constant anchor matches={s.count(old)}')
          s = s.replace(old, new, 1)
          bound = 'constexpr std::size_t kMaxSelectedInlineArrayElements = 64;\n'
          if s.count(bound) != 1:
              raise SystemExit(f'enum bound anchor matches={s.count(bound)}')
          s = s.replace(bound, bound + 'constexpr std::size_t kMaxSelectedInlineEnumEntries = 64;\n', 1)

          marker = 'std::optional<LocalScalarValue> inspect_inline_scalar_unit(\n'
          if s.count(marker) != 1:
              raise SystemExit(f'inspection marker matches={s.count(marker)}')
          helper = r'''bool selected_inline_enum_constant_form(std::uint64_t form) {
            return form == kDwFormData1 || form == kDwFormData2 ||
                   form == kDwFormData4 || form == kDwFormData8 ||
                   form == kDwFormUdata || form == kDwFormImplicitConst;
          }

          std::optional<LocalEnumType> selected_inline_enum_type(
              const std::vector<Die>& dies, std::uint64_t type_offset) {
            for (unsigned depth = 0; depth < 16; ++depth) {
              const auto index = die_index_by_offset(dies, type_offset);
              if (!index) {
                throw std::runtime_error("selected-inline enum type references an unknown DIE");
              }
              const auto& die = dies[*index];
              if (die.tag == kDwTagTypedef || die.tag == kDwTagConstType) {
                const auto* wrapped = attribute(die, kDwAtType);
                if (wrapped == nullptr || wrapped->form != kDwFormRef4) {
                  throw std::runtime_error(
                      "selected-inline enum wrapper does not use DW_FORM_ref4");
                }
                type_offset = wrapped->number;
                continue;
              }
              if (die.tag != kInlineDwTagEnumerationType) return std::nullopt;

              const auto* name = attribute(die, kDwAtName);
              const auto* size = attribute(die, kDwAtByteSize);
              if (name == nullptr || name->text.empty()) {
                throw std::runtime_error("selected-inline enum has no supported name");
              }
              if (size == nullptr || size->number == 0 ||
                  size->number > sizeof(std::uint64_t)) {
                throw std::runtime_error(
                    "selected-inline enum has an unsupported scalar byte size");
              }
              const auto byte_size = static_cast<std::size_t>(size->number);

              bool is_signed = false;
              const auto* encoding = attribute(die, kDwAtEncoding);
              const auto* underlying_ref = attribute(die, kDwAtType);
              if (encoding != nullptr) {
                if (encoding->number != kDwAteSigned &&
                    encoding->number != kDwAteUnsigned) {
                  throw std::runtime_error(
                      "selected-inline enum direct encoding is not signed/unsigned integer");
                }
                is_signed = encoding->number == kDwAteSigned;
                if (underlying_ref != nullptr) {
                  if (underlying_ref->form != kDwFormRef4) {
                    throw std::runtime_error(
                        "selected-inline enum underlying type does not use DW_FORM_ref4");
                  }
                  const auto underlying = resolve_integer_type(dies, underlying_ref->number);
                  if (underlying.byte_size != byte_size ||
                      underlying.is_signed != is_signed) {
                    throw std::runtime_error(
                        "selected-inline enum direct and underlying representations disagree");
                  }
                }
              } else {
                if (underlying_ref == nullptr || underlying_ref->form != kDwFormRef4) {
                  throw std::runtime_error(
                      "selected-inline enum has no compiler-described integer representation");
                }
                const auto underlying = resolve_integer_type(dies, underlying_ref->number);
                if (underlying.byte_size != byte_size) {
                  throw std::runtime_error(
                      "selected-inline enum byte size disagrees with its underlying type");
                }
                is_signed = underlying.is_signed;
              }

              LocalEnumType result{name->text, byte_size, is_signed, {}};
              for (std::size_t child = 0; child < dies.size(); ++child) {
                if (dies[child].parent != *index) continue;
                if (dies[child].tag != kInlineDwTagEnumerator) {
                  throw std::runtime_error(
                      "selected-inline enum has an unsupported direct child DIE");
                }
                if (result.enumerators.size() >= kMaxSelectedInlineEnumEntries) {
                  throw std::runtime_error(
                      "selected-inline enum exceeds the bounded 64-entry table");
                }
                const auto* entry_name = attribute(dies[child], kDwAtName);
                const auto* constant = attribute(dies[child], kInlineDwAtConstValue);
                if (entry_name == nullptr || entry_name->text.empty()) {
                  throw std::runtime_error("selected-inline enumerator has no supported name");
                }
                if (constant == nullptr ||
                    !selected_inline_enum_constant_form(constant->form)) {
                  throw std::runtime_error(
                      "selected-inline enumerator has no supported constant value");
                }
                const auto raw = truncate_integer(constant->number, byte_size);
                if (!is_signed && raw != constant->number) {
                  throw std::runtime_error(
                      "selected-inline unsigned enumerator exceeds enum storage width");
                }
                const auto duplicate = std::find_if(
                    result.enumerators.begin(), result.enumerators.end(),
                    [&](const LocalEnumEntry& existing) {
                      return existing.name == entry_name->text;
                    });
                if (duplicate != result.enumerators.end()) {
                  throw std::runtime_error(
                      "selected-inline enum has duplicate enumerator names");
                }
                result.enumerators.push_back(LocalEnumEntry{entry_name->text, raw});
              }
              if (result.enumerators.empty()) {
                throw std::runtime_error("selected-inline enum has no bounded direct enumerators");
              }
              return result;
            }
            throw std::runtime_error("selected-inline enum type chain is too deep");
          }

          '''
          s = s.replace(marker, helper + marker, 1)

          pattern = re.compile(
              r'(\s+const auto direct_array =.*?: selected_inline_fixed_array_type\(dies, type->number\);\n)'
              r'(\s+const auto value_type =)', re.S)
          s, count = pattern.subn(
              r'''\1  const auto direct_enum =
              (pointee_type || direct_structure || direct_union || direct_array)
                  ? std::optional<LocalEnumType>{}
                  : selected_inline_enum_type(dies, type->number);
          \2''', s, count=1)
          if count != 1:
              raise SystemExit(f'direct enum insertion matches={count}')

          pattern = re.compile(
              r'(: direct_array\s*\? ValueType\{direct_array->byte_size, false,\s*'
              r'LocalValueKind::Array, \{\}\}\s*): resolve_value_type\(dies, type->number\);')
          replacement = (r'\1: direct_enum\n'
                         r'                  ? ValueType{direct_enum->byte_size, direct_enum->is_signed,\n'
                         r'                              LocalValueKind::Enumeration, {}}\n'
                         r'                  : resolve_value_type(dies, type->number);')
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'value type enum branch matches={count}')

          guard = 'if (!direct_structure && !direct_union && !direct_array &&\n'
          if s.count(guard) != 1:
              raise SystemExit(f'scalar guard matches={s.count(guard)}')
          s = s.replace(guard,
                        'if (!direct_structure && !direct_union && !direct_array && !direct_enum &&\n',
                        1)

          pattern = re.compile(
              r'(auto result =\s*materialize_snapshot_memory_value\(owner, requested_name, value_type, memory\);\s*'
              r'attach_pointer_metadata\(result, pointee_type\);)(\s*return result;)')
          s, count = pattern.subn(r'\1\n    if (direct_enum) result.enum_type = *direct_enum;\2', s, count=1)
          if count != 1:
              raise SystemExit(f'caller materialization matches={count}')

          pattern = re.compile(
              r'(LocalScalarValue result\{owner\.module_path, std::string\(requested_name\),\s*'
              r'truncate_integer\(raw, value_type\.byte_size\),\s*'
              r'value_type\.byte_size, value_type\.is_signed,\s*)'
              r'LocalValueKind::Integer(\};\s*result\.storage = LocalValueStorage::SnapshotCoreRegister;)')
          s, count = pattern.subn(
              r'\1value_type.kind\2\n  if (direct_enum) result.enum_type = *direct_enum;', s, count=1)
          if count != 1:
              raise SystemExit(f'frame-zero enum materialization matches={count}')
          source.write_text(s)

          cli = Path('src/cli/core_main.cpp')
          s = cli.read_text()
          old = '''  std::cout << value.module_path << '!' << value.name << " = ";
            if (value.kind == mdbg::LocalValueKind::Union) {'''
          new = '''  std::cout << value.module_path << '!' << value.name << " = ";
            if (value.kind == mdbg::LocalValueKind::Enumeration) {
              if (!value.enum_type) {
                throw std::logic_error("bounded enum value lost its type metadata");
              }
              if (const auto symbol = mdbg::local_enum_symbol(value)) {
                std::cout << value.enum_type->name << "::" << *symbol << " (0x"
                          << std::hex << value.raw_value << std::dec << ')';
              } else {
                std::cout << "0x" << std::hex << value.raw_value << std::dec;
              }
            } else if (value.kind == mdbg::LocalValueKind::Union) {'''
          if s.count(old) != 1:
              raise SystemExit(f'CLI enum value anchor matches={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''  if (value.kind == mdbg::LocalValueKind::Floating) {
              std::cout << "floating";
            } else if (value.kind == mdbg::LocalValueKind::Union) {'''
          new = '''  if (value.kind == mdbg::LocalValueKind::Floating) {
              std::cout << "floating";
            } else if (value.kind == mdbg::LocalValueKind::Enumeration) {
              if (!value.enum_type) {
                throw std::logic_error("bounded enum value lost its type metadata");
              }
              std::cout << "enum " << (value.enum_type->is_signed ? "signed" : "unsigned");
            } else if (value.kind == mdbg::LocalValueKind::Union) {'''
          if s.count(old) != 1:
              raise SystemExit(f'CLI enum metadata anchor matches={s.count(old)}')
          cli.write_text(s.replace(old, new, 1))
          PY

          git diff --check
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/dwarf/local_value.hpp src/dwarf/source_lookup.cpp src/cli/core_main.cpp
          git commit -m 'fix: recover selected-inline enum identity'
          git push origin HEAD:feat/core-inline-enum-identity
