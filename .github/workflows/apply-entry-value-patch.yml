name: apply-entry-value-ownership

on:
  push:
    branches:
      - feat/dwarf-entry-value

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded entry-value ownership patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Debugger API/state: process-domain/TID scoped managed-breakpoint register snapshots.
          replace_exact(
              "src/debugger/debugger.hpp",
              "  user_regs_struct registers() const;\n  void set_register(std::string_view name, std::uint64_t value);\n",
              "  user_regs_struct registers() const;\n"
              "  [[nodiscard]] std::optional<user_regs_struct> breakpoint_register_snapshot(\n"
              "      pid_t tid, std::uintptr_t address) const;\n"
              "  void set_register(std::string_view name, std::uint64_t value);\n")
          replace_exact(
              "src/debugger/debugger.hpp",
              "    std::map<std::size_t, std::uintptr_t> breakpoint_ids;\n"
              "    std::optional<PendingBreakpointStep> pending_breakpoint_step;\n",
              "    std::map<std::size_t, std::uintptr_t> breakpoint_ids;\n"
              "    std::map<std::pair<pid_t, std::uintptr_t>, user_regs_struct>\n"
              "        breakpoint_register_snapshots;\n"
              "    std::optional<PendingBreakpointStep> pending_breakpoint_step;\n")
          replace_exact(
              "src/debugger/debugger.hpp",
              "  void discard_image_state() noexcept;\n",
              "  void discard_image_state() noexcept;\n"
              "  void discard_breakpoint_register_snapshots(pid_t tid) noexcept;\n")
          replace_exact(
              "src/debugger/debugger.hpp",
              "  std::map<std::size_t, std::uintptr_t> breakpoint_ids_;\n"
              "  std::size_t next_breakpoint_id_{1};\n",
              "  std::map<std::size_t, std::uintptr_t> breakpoint_ids_;\n"
              "  std::map<std::pair<pid_t, std::uintptr_t>, user_regs_struct>\n"
              "      breakpoint_register_snapshots_;\n"
              "  std::size_t next_breakpoint_id_{1};\n")

          replace_exact(
              "src/debugger/debugger.cpp",
              "  breakpoint_ids_.swap(domain.breakpoint_ids);\n"
              "  std::swap(pending_breakpoint_step_, domain.pending_breakpoint_step);\n",
              "  breakpoint_ids_.swap(domain.breakpoint_ids);\n"
              "  breakpoint_register_snapshots_.swap(domain.breakpoint_register_snapshots);\n"
              "  std::swap(pending_breakpoint_step_, domain.pending_breakpoint_step);\n")
          replace_exact(
              "src/debugger/debugger.cpp",
              "user_regs_struct Debugger::registers() const {\n"
              "  return lowlevel::get_registers(stopped_tid());\n"
              "}\n\n",
              "user_regs_struct Debugger::registers() const {\n"
              "  return lowlevel::get_registers(stopped_tid());\n"
              "}\n\n"
              "std::optional<user_regs_struct> Debugger::breakpoint_register_snapshot(\n"
              "    pid_t tid, std::uintptr_t address) const {\n"
              "  const auto it = breakpoint_register_snapshots_.find({tid, address});\n"
              "  if (it == breakpoint_register_snapshots_.end()) return std::nullopt;\n"
              "  return it->second;\n"
              "}\n\n")
          replace_exact(
              "src/debugger/debugger.cpp",
              "  breakpoint_ids_.clear();\n  pending_breakpoint_step_.reset();\n",
              "  breakpoint_ids_.clear();\n"
              "  breakpoint_register_snapshots_.clear();\n"
              "  pending_breakpoint_step_.reset();\n",
              count=2)
          replace_exact(
              "src/debugger/debugger.cpp",
              "void Debugger::discard_image_state() noexcept {\n"
              "  breakpoints_by_address_.clear();\n"
              "  breakpoint_ids_.clear();\n"
              "  breakpoint_register_snapshots_.clear();\n"
              "  pending_breakpoint_step_.reset();\n"
              "  watchpoint_.reset();\n"
              "  watchpoint_register_snapshot_.reset();\n"
              "  pending_thread_starts_.clear();\n"
              "  pending_signals_.clear();\n"
              "}\n\n",
              "void Debugger::discard_image_state() noexcept {\n"
              "  breakpoints_by_address_.clear();\n"
              "  breakpoint_ids_.clear();\n"
              "  breakpoint_register_snapshots_.clear();\n"
              "  pending_breakpoint_step_.reset();\n"
              "  watchpoint_.reset();\n"
              "  watchpoint_register_snapshot_.reset();\n"
              "  pending_thread_starts_.clear();\n"
              "  pending_signals_.clear();\n"
              "}\n\n"
              "void Debugger::discard_breakpoint_register_snapshots(pid_t tid) noexcept {\n"
              "  for (auto it = breakpoint_register_snapshots_.begin();\n"
              "       it != breakpoint_register_snapshots_.end();) {\n"
              "    if (it->first.first == tid) {\n"
              "      it = breakpoint_register_snapshots_.erase(it);\n"
              "    } else {\n"
              "      ++it;\n"
              "    }\n"
              "  }\n"
              "}\n\n")
          replace_exact(
              "src/debugger/debugger.cpp",
              "      pending_thread_starts_.erase(event.tid);\n"
              "      pending_signals_.erase(event.tid);\n",
              "      pending_thread_starts_.erase(event.tid);\n"
              "      pending_signals_.erase(event.tid);\n"
              "      discard_breakpoint_register_snapshots(event.tid);\n",
              count=2)
          replace_exact(
              "src/debugger/debugger.cpp",
              "                         executable_path_, {}, {}, {}, {}, std::nullopt, child_watchpoint,\n"
              "                         child_watchpoint_snapshot});",
              "                         executable_path_, {}, {}, {}, {}, {}, std::nullopt,\n"
              "                         child_watchpoint, child_watchpoint_snapshot});")
          replace_exact(
              "src/debugger/debugger.cpp",
              "          pending_thread_starts_.clear();\n"
              "          pending_signals_.clear();\n",
              "          pending_thread_starts_.clear();\n"
              "          pending_signals_.clear();\n"
              "          breakpoint_register_snapshots_.clear();\n")
          replace_exact(
              "src/debugger/debugger.cpp",
              "  regs.rip = address;\n"
              "  lowlevel::set_registers(tid, regs);\n",
              "  regs.rip = address;\n"
              "  breakpoint_register_snapshots_[{tid, address}] = regs;\n"
              "  lowlevel::set_registers(tid, regs);\n")

          # Exact compiler-proven expression: DW_OP_entry_value(DW_OP_reg5); DW_OP_stack_value.
          replace_exact(
              "src/dwarf/source_lookup.cpp",
              "constexpr std::uint8_t kDwOpFbreg = 0x91;\n"
              "constexpr std::uint8_t kDwOpCallFrameCfa = 0x9c;\n",
              "constexpr std::uint8_t kDwOpFbreg = 0x91;\n"
              "constexpr std::uint8_t kDwOpStackValue = 0x9f;\n"
              "constexpr std::uint8_t kDwOpEntryValue = 0xa3;\n"
              "constexpr std::uint8_t kDwOpCallFrameCfa = 0x9c;\n")
          replace_exact(
              "src/dwarf/source_lookup.cpp",
              "std::optional<LocalScalarValue> inspect_unit(const DebugSections& sections,\n",
              "std::uint64_t evaluate_entry_rdi(\n"
              "    const std::vector<std::byte>& expression, const Debugger& debugger,\n"
              "    const ElfFile& module, const Die& subprogram_die) {\n"
              "  std::size_t cursor = 1;\n"
              "  const auto nested_length =\n"
              "      read_uleb(expression, cursor, expression.size(), \"DW_OP_entry_value length\");\n"
              "  if (nested_length != 1 || cursor >= expression.size() ||\n"
              "      std::to_integer<std::uint8_t>(expression[cursor]) != kDwOpReg5) {\n"
              "    throw std::runtime_error(\n"
              "        \"DW_OP_entry_value only supports the compiler-proven nested DW_OP_reg5 form\");\n"
              "  }\n"
              "  ++cursor;\n"
              "  if (cursor >= expression.size() ||\n"
              "      std::to_integer<std::uint8_t>(expression[cursor]) != kDwOpStackValue) {\n"
              "    throw std::runtime_error(\n"
              "        \"DW_OP_entry_value requires the compiler-proven trailing DW_OP_stack_value\");\n"
              "  }\n"
              "  ++cursor;\n"
              "  if (cursor != expression.size()) {\n"
              "    throw std::runtime_error(\n"
              "        \"unsupported trailing operations after DW_OP_entry_value\");\n"
              "  }\n"
              "\n"
              "  const auto* low_pc = attribute(subprogram_die, kDwAtLowPc);\n"
              "  if (low_pc == nullptr || low_pc->form != kDwFormAddr) {\n"
              "    throw std::runtime_error(\n"
              "        \"DW_OP_entry_value requires a subprogram with supported DW_AT_low_pc\");\n"
              "  }\n"
              "  const auto bias = module.load_bias(debugger.pid());\n"
              "  if (low_pc->number > std::numeric_limits<std::uint64_t>::max() - bias) {\n"
              "    throw std::runtime_error(\"subprogram entry runtime address overflows\");\n"
              "  }\n"
              "  const auto runtime_entry = static_cast<std::uintptr_t>(low_pc->number + bias);\n"
              "  const auto snapshot = debugger.breakpoint_register_snapshot(\n"
              "      debugger.active_tid(), runtime_entry);\n"
              "  if (!snapshot) {\n"
              "    throw std::runtime_error(\n"
              "        \"DW_OP_entry_value requires an observed function-entry breakpoint snapshot\");\n"
              "  }\n"
              "  return snapshot->rdi;\n"
              "}\n\n"
              "std::optional<LocalScalarValue> inspect_unit(const DebugSections& sections,\n")
          replace_exact(
              "src/dwarf/source_lookup.cpp",
              "  if (location_expression.empty() ||\n"
              "      std::to_integer<std::uint8_t>(location_expression.front()) != kDwOpFbreg) {\n",
              "  if (value_type.kind != LocalValueKind::Structure && !location_expression.empty() &&\n"
              "      std::to_integer<std::uint8_t>(location_expression.front()) == kDwOpEntryValue) {\n"
              "    const auto raw = truncate_integer(\n"
              "        evaluate_entry_rdi(location_expression, debugger, module, subprogram_die),\n"
              "        value_type.byte_size);\n"
              "    return LocalScalarValue{module.path(), std::string(name), raw,\n"
              "                            value_type.byte_size, value_type.is_signed,\n"
              "                            value_type.kind};\n"
              "  }\n\n"
              "  if (location_expression.empty() ||\n"
              "      std::to_integer<std::uint8_t>(location_expression.front()) != kDwOpFbreg) {\n")

          # Permanent regression: fail closed without an observed function-entry snapshot,
          # then prove entry capture -> live-RDI clobber -> historical value through API and CLI.
          test = Path("tests/dwarf5_local_value_integration.cpp")
          text = test.read_text()
          text = text.replace("#include <cstdlib>\n", "")
          old_dump = '''void dump_location_lists(const std::string& fixture) {\n  const auto command = "readelf --debug-dump=loc --wide \\\"" + fixture + "\\\"";\n  (void)std::system(command.c_str());\n}\n\n'''
          if old_dump not in text:
              raise SystemExit("temporary readelf diagnostic helper not found")
          text = text.replace(old_dump, "")
          old_try = '''  mdbg::LocalScalarValue entry_value;\n  try {\n    entry_value = mdbg::inspect_local_integer(debugger, elf, "entry_parameter");\n  } catch (...) {\n    dump_location_lists(fixture);\n    throw;\n  }\n'''
          if old_try not in text:
              raise SystemExit("temporary readelf diagnostic call not found")
          text = text.replace(old_try,
                              '  const auto entry_value =\\n'
                              '      mdbg::inspect_local_integer(debugger, elf, "entry_parameter");\\n')

          old_start = '''void test_direct_api(const std::string& fixture) {\n  auto debugger = mdbg::Debugger::launch(fixture, {});\n  const mdbg::ElfFile elf(fixture);\n  const auto entry_probe = elf.find_symbol("entry_parameter_probe");\n  const auto optimized_probe = elf.find_symbol("optimized_local_probe");\n  require(entry_probe.has_value(), "DWARF5 entry-value probe symbol is missing");\n  require(optimized_probe.has_value(), "DWARF5 optimized-local probe symbol is missing");\n  const auto entry_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *entry_probe));\n  const auto optimized_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *optimized_probe));\n  debugger.add_breakpoint(entry_address);\n  debugger.add_breakpoint(optimized_address);\n\n  auto stop = debugger.continue_execution();\n  require(stop.reason == mdbg::StopReason::Breakpoint &&\n              stop.breakpoint_address == entry_address,\n          "DWARF5 fixture did not stop in the entry-value parameter range");\n  const auto current_rdi = debugger.registers().rdi;\n  require(current_rdi == kExpectedEntryRdiSentinel,\n          "entry-value helper did not leave the expected current RDI sentinel");\n\n'''
          new_start = '''void test_missing_entry_snapshot(const std::string& fixture) {\n  auto debugger = mdbg::Debugger::launch(fixture, {});\n  const mdbg::ElfFile elf(fixture);\n  const auto entry_probe = elf.find_symbol("entry_parameter_probe");\n  require(entry_probe.has_value(), "DWARF5 entry-value probe symbol is missing");\n  const auto entry_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *entry_probe));\n  debugger.add_breakpoint(entry_address);\n\n  const auto stop = debugger.continue_execution();\n  require(stop.reason == mdbg::StopReason::Breakpoint &&\n              stop.breakpoint_address == entry_address,\n          "DWARF5 fixture did not stop in the entry-value parameter range");\n  require(debugger.registers().rdi == kExpectedEntryRdiSentinel,\n          "entry-value helper did not leave the expected current RDI sentinel");\n\n  bool missing_snapshot_failed = false;\n  try {\n    (void)mdbg::inspect_local_integer(debugger, elf, "entry_parameter");\n  } catch (const std::runtime_error& error) {\n    missing_snapshot_failed =\n        std::string(error.what()).find("observed function-entry breakpoint snapshot") !=\n        std::string::npos;\n  }\n  require(missing_snapshot_failed,\n          "DW_OP_entry_value must not fall back to the current register state");\n\n  const auto exit = debugger.continue_execution();\n  require(exit.reason == mdbg::StopReason::Exited && exit.value == 0,\n          "missing-snapshot fixture did not exit cleanly");\n}\n\nvoid test_direct_api(const std::string& fixture) {\n  auto debugger = mdbg::Debugger::launch(fixture, {});\n  const mdbg::ElfFile elf(fixture);\n  const auto entry_function = elf.find_symbol("inspect_entry_parameter");\n  const auto entry_probe = elf.find_symbol("entry_parameter_probe");\n  const auto optimized_probe = elf.find_symbol("optimized_local_probe");\n  require(entry_function.has_value(), "DWARF5 entry function symbol is missing");\n  require(entry_probe.has_value(), "DWARF5 entry-value probe symbol is missing");\n  require(optimized_probe.has_value(), "DWARF5 optimized-local probe symbol is missing");\n  const auto function_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *entry_function));\n  const auto entry_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *entry_probe));\n  const auto optimized_address = static_cast<std::uintptr_t>(\n      elf.runtime_address(debugger.pid(), *optimized_probe));\n  debugger.add_breakpoint(function_address);\n  debugger.add_breakpoint(entry_address);\n  debugger.add_breakpoint(optimized_address);\n\n  auto stop = debugger.continue_execution();\n  require(stop.reason == mdbg::StopReason::Breakpoint &&\n              stop.breakpoint_address == function_address,\n          "DWARF5 fixture did not expose the function-entry register state");\n  require(debugger.registers().rdi == kExpectedEntryParameter,\n          "function-entry breakpoint did not observe the original RDI parameter");\n\n  stop = debugger.continue_execution();\n  require(stop.reason == mdbg::StopReason::Breakpoint &&\n              stop.breakpoint_address == entry_address,\n          "DWARF5 fixture did not stop in the entry-value parameter range");\n  const auto current_rdi = debugger.registers().rdi;\n  require(current_rdi == kExpectedEntryRdiSentinel,\n          "entry-value helper did not leave the expected current RDI sentinel");\n\n'''
          if old_start not in text:
              raise SystemExit("direct API entry-value prelude not found")
          text = text.replace(old_start, new_start)

          old_script = '''  const std::string script =\n      "break entry_parameter_probe\\n"\n      "break optimized_local_probe\\n"\n      "continue\\n"\n      "print entry_parameter\\n"\n      "continue\\n"\n      "print optimized_local\\n"\n      "continue\\n";\n'''
          new_script = '''  const std::string script =\n      "break inspect_entry_parameter\\n"\n      "break entry_parameter_probe\\n"\n      "break optimized_local_probe\\n"\n      "continue\\n"\n      "continue\\n"\n      "print entry_parameter\\n"\n      "continue\\n"\n      "print optimized_local\\n"\n      "continue\\n";\n'''
          if old_script not in text:
              raise SystemExit("CLI script not found")
          text = text.replace(old_script, new_script)
          replace_old = '''  require(output.find("Breakpoint 1") != std::string::npos &&\n              output.find("Breakpoint 2") != std::string::npos,\n          "DWARF5 CLI did not install both source-value breakpoints\\n" + output);\n'''
          replace_new = '''  require(output.find("Breakpoint 1") != std::string::npos &&\n              output.find("Breakpoint 2") != std::string::npos &&\n              output.find("Breakpoint 3") != std::string::npos,\n          "DWARF5 CLI did not install all source-value breakpoints\\n" + output);\n'''
          if replace_old not in text:
              raise SystemExit("CLI breakpoint assertion not found")
          text = text.replace(replace_old, replace_new)
          old_main = '''  try {\n    test_direct_api(argv[1]);\n    test_cli(argv[2], argv[1]);\n'''
          new_main = '''  try {\n    test_missing_entry_snapshot(argv[1]);\n    test_direct_api(argv[1]);\n    test_cli(argv[2], argv[1]);\n'''
          if old_main not in text:
              raise SystemExit("integration main dispatch not found")
          text = text.replace(old_main, new_main)
          test.write_text(text)

          # The construction workflow must not survive into the candidate tree.
          Path(".github/workflows/apply-entry-value-patch.yml").unlink()
          PY

          git diff --check
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add -A
          git commit -m 'feat: preserve observed function-entry register state'
          git push origin HEAD:feat/dwarf-entry-value
