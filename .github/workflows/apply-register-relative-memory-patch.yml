name: apply register-relative memory patch

on:
  push:
    branches:
      - feat/dwarf-register-relative-memory-local

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dwarf-register-relative-memory-local
      - name: Apply bounded source-value patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dwarf/source_lookup.cpp')
          text = path.read_text()

          old_helper = '''std::uint64_t evaluate_breg5_stack_value(const std::vector<std::byte>& expression,
                                         const Debugger& debugger) {
  if (expression.empty() ||
      std::to_integer<std::uint8_t>(expression.front()) != kDwOpBreg5) {
    throw std::runtime_error(
        "local value location is not the compiler-proven DW_OP_breg5 form");
  }
  std::size_t cursor = 1;
  const auto offset =
      read_sleb(expression, cursor, expression.size(), "DW_OP_breg5 offset");
  if (cursor >= expression.size() ||
      std::to_integer<std::uint8_t>(expression[cursor]) != kDwOpStackValue) {
    throw std::runtime_error(
        "DW_OP_breg5 value requires the compiler-proven trailing DW_OP_stack_value");
  }
  ++cursor;
  if (cursor != expression.size()) {
    throw std::runtime_error("unsupported trailing operations after DW_OP_breg5 value");
  }
  return add_signed(debugger.registers().rdi, offset, "DW_OP_breg5 value");
}
'''
          new_helper = old_helper + '''
std::uint64_t evaluate_breg5_memory_address(
    const std::vector<std::byte>& expression, const Debugger& debugger) {
  if (expression.empty() ||
      std::to_integer<std::uint8_t>(expression.front()) != kDwOpBreg5) {
    throw std::runtime_error(
        "local memory location is not the compiler-proven DW_OP_breg5 form");
  }
  std::size_t cursor = 1;
  const auto offset =
      read_sleb(expression, cursor, expression.size(), "DW_OP_breg5 memory offset");
  if (cursor != expression.size()) {
    throw std::runtime_error(
        "unsupported trailing operations after DW_OP_breg5 memory location");
  }
  return add_signed(debugger.registers().rdi, offset,
                    "DW_OP_breg5 memory address");
}
'''

          old_dispatch = '''  if (value_type.kind != LocalValueKind::Structure && !location_expression.empty() &&
      std::to_integer<std::uint8_t>(location_expression.front()) == kDwOpBreg5) {
    const auto raw = truncate_integer(
        evaluate_breg5_stack_value(location_expression, debugger),
        value_type.byte_size);
    return LocalScalarValue{module.path(), std::string(name), raw,
                            value_type.byte_size, value_type.is_signed,
                            value_type.kind};
  }
'''
          new_dispatch = '''  if (value_type.kind != LocalValueKind::Structure && !location_expression.empty() &&
      std::to_integer<std::uint8_t>(location_expression.front()) == kDwOpBreg5) {
    const bool stack_value =
        std::to_integer<std::uint8_t>(location_expression.back()) == kDwOpStackValue;
    const auto raw = stack_value
                         ? truncate_integer(
                               evaluate_breg5_stack_value(location_expression, debugger),
                               value_type.byte_size)
                         : read_integer(
                               debugger,
                               evaluate_breg5_memory_address(location_expression, debugger),
                               value_type.byte_size);
    return LocalScalarValue{module.path(), std::string(name), raw,
                            value_type.byte_size, value_type.is_signed,
                            value_type.kind};
  }
'''

          if text.count(old_helper) != 1:
              raise SystemExit('expected exactly one DW_OP_breg5 helper')
          if text.count(old_dispatch) != 1:
              raise SystemExit('expected exactly one DW_OP_breg5 dispatch')
          text = text.replace(old_helper, new_helper, 1)
          text = text.replace(old_dispatch, new_dispatch, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/dwarf/source_lookup.cpp
      - name: Commit production patch
        shell: bash
        run: |
          if git diff --quiet -- src/dwarf/source_lookup.cpp; then
            echo 'No source patch produced' >&2
            exit 1
          fi
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/dwarf/source_lookup.cpp
          git commit -m 'feat: recover register-relative memory locals'
          git push origin HEAD:feat/dwarf-register-relative-memory-local
