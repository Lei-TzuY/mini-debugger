name: apply-register-relative-memory-patch

on:
  push:
    branches: [feat/dwarf-register-relative-memory-local]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dwarf-register-relative-memory-local
      - name: Patch source lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/dwarf/source_lookup.cpp')
          s = p.read_text()
          marker = '''  return add_signed(debugger.registers().rdi, offset, "DW_OP_breg5 value");
}

std::uint64_t evaluate_entry_rdi('''
          replacement = '''  return add_signed(debugger.registers().rdi, offset, "DW_OP_breg5 value");
}

std::uint64_t evaluate_breg5_memory_address(
    const std::vector<std::byte>& expression, const Debugger& debugger) {
  if (expression.empty() ||
      std::to_integer<std::uint8_t>(expression.front()) != kDwOpBreg5) {
    throw std::runtime_error(
        "local memory location is not the compiler-proven DW_OP_breg5 form");
  }
  std::size_t cursor = 1;
  const auto offset =
      read_sleb(expression, cursor, expression.size(), "DW_OP_breg5 memory offset");
  if (cursor != expression.size()) {
    throw std::runtime_error(
        "unsupported trailing operations after DW_OP_breg5 memory location");
  }
  return add_signed(debugger.registers().rdi, offset,
                    "DW_OP_breg5 memory address");
}

std::uint64_t evaluate_entry_rdi('''
          old = '''  if (value_type.kind != LocalValueKind::Structure && !location_expression.empty() &&
      std::to_integer<std::uint8_t>(location_expression.front()) == kDwOpBreg5) {
    const auto raw = truncate_integer(
        evaluate_breg5_stack_value(location_expression, debugger),
        value_type.byte_size);
    return LocalScalarValue{module.path(), std::string(name), raw,
                            value_type.byte_size, value_type.is_signed,
                            value_type.kind};
  }
'''
          new = '''  if (value_type.kind != LocalValueKind::Structure && !location_expression.empty() &&
      std::to_integer<std::uint8_t>(location_expression.front()) == kDwOpBreg5) {
    const bool stack_value =
        std::to_integer<std::uint8_t>(location_expression.back()) == kDwOpStackValue;
    const auto raw = stack_value
                         ? truncate_integer(
                               evaluate_breg5_stack_value(location_expression, debugger),
                               value_type.byte_size)
                         : read_integer(
                               debugger,
                               evaluate_breg5_memory_address(location_expression, debugger),
                               value_type.byte_size);
    return LocalScalarValue{module.path(), std::string(name), raw,
                            value_type.byte_size, value_type.is_signed,
                            value_type.kind};
  }
'''
          if marker in s:
              if s.count(marker) != 1 or s.count(old) != 1:
                  raise SystemExit('patch anchors are not unique')
              s = s.replace(marker, replacement, 1).replace(old, new, 1)
              p.write_text(s)
          elif 'evaluate_breg5_memory_address' not in s:
              raise SystemExit('patch anchor not found')
          PY
          git diff --check
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/dwarf/source_lookup.cpp; then
            exit 0
          fi
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/dwarf/source_lookup.cpp
          git commit -m 'feat: recover register-relative memory locals'
          git push origin HEAD:feat/dwarf-register-relative-memory-local
