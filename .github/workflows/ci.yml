name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cxx_flags: ""
          - compiler: clang-large
            cc: clang
            cxx: clang++
            cxx_flags: -mcmodel=large
    name: build-test (${{ matrix.compiler }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/mdbg-core-%p
          ulimit -c unlimited
          ctest --test-dir build --output-on-failure --timeout 30

          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_fpregset_integration.cpp build/libmdbg_core.a -pthread \
            -o build/core_fpregset_integration
          rm -f /tmp/mdbg-core-* /tmp/mdbg-fpregset-ready
          set +e
          ./build/formal_parameter_fixture_pie \
            --snapshot-crash-threaded /tmp/mdbg-fpregset-ready
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "FPREGSET fixture unexpectedly exited cleanly"
            exit 1
          fi
          core=$(find /tmp -maxdepth 1 -type f -name 'mdbg-core-*' | head -n 1)
          test -n "$core"
          sibling=$(cat /tmp/mdbg-fpregset-ready)
          python3 tests/core_fpregset_oracle.py "$core"
          ./build/core_fpregset_integration "$core" "$sibling"

          "$CC" -O1 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/xmm_core_value_fixture.c -pthread \
            -o build/xmm_core_value_fixture_pie
          "$CC" -O1 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/xmm_core_value_fixture.c -pthread \
            -o build/xmm_core_value_fixture_nopie
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_xmm_value_integration.cpp build/libmdbg_core.a -pthread \
            -o build/core_xmm_value_integration

          for fixture in build/xmm_core_value_fixture_pie build/xmm_core_value_fixture_nopie; do
            python3 tests/core_xmm_dwarf_oracle.py "$fixture"
            tag=$(basename "$fixture")
            ready="/tmp/mdbg-${tag}-ready"
            rm -f /tmp/mdbg-core-* "$ready"
            set +e
            "$fixture" "$ready"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "XMM source-value fixture unexpectedly exited cleanly"
              exit 1
            fi
            core=$(find /tmp -maxdepth 1 -type f -name 'mdbg-core-*' | head -n 1)
            test -n "$core"
            sibling=$(cat "$ready")
            ./build/core_xmm_value_integration "$core" "$sibling"
            output=$(printf 'print xmm_value\nprint stack_local\nderef scalar_pointer\nderef aggregate_pointer\nthread %s\nprint xmm_value\nquit\n' "$sibling" | \
              ./build/mdbg-core "$core")
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -F 'xmm_value = 1234.25'
            printf '%s\n' "$output" | grep -F 'stack_local = 0x4f3e2d1c0b9a8877'
            printf '%s\n' "$output" | grep -F '*scalar_pointer = 0x8877665544332211'
            printf '%s\n' "$output" | grep -F '*aggregate_pointer = { first=0x123456789abcdef, second=0xfedcba9876543210 }'
            printf '%s\n' "$output" | grep -F 'xmm_value = 9876.5'
          done
