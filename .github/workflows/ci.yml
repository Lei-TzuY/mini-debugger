name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cxx_flags: ""
          - compiler: clang-large
            cc: clang
            cxx: clang++
            cxx_flags: -mcmodel=large
    name: build-test (${{ matrix.compiler }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded register-relative-memory patch
        if: github.ref == 'refs/heads/feat/dwarf-register-relative-memory-local' && matrix.compiler == 'gcc'
        shell: bash
        env:
          PATCH_MARKER: ICByZXR1cm4gYWRkX3NpZ25lZChkZWJ1Z2dlci5yZWdpc3RlcnMoKS5yZGksIG9mZnNldCwgIkRXX09QX2JyZWc1IHZhbHVlIik7Cn0KCnN0ZDo6dWludDY0X3QgZXZhbHVhdGVfZW50cnlfcmRpKA==
          PATCH_REPLACEMENT: 
          PATCH_OLD: 
          PATCH_NEW: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path('src/dwarf/source_lookup.cpp')
          s = p.read_text()
          if 'evaluate_breg5_memory_address' not in s:
              marker = base64.b64decode(os.environ['PATCH_MARKER']).decode()
              replacement = base64.b64decode(os.environ['PATCH_REPLACEMENT']).decode()
              old = base64.b64decode(os.environ['PATCH_OLD']).decode()
              new = base64.b64decode(os.environ['PATCH_NEW']).decode()
              if s.count(marker) != 1 or s.count(old) != 1:
                  raise SystemExit('source patch anchors are not unique')
              p.write_text(s.replace(marker, replacement, 1).replace(old, new, 1))
          PY
          git diff --check
          if ! git diff --quiet -- src/dwarf/source_lookup.cpp; then
            git config user.name 'LeiZ'
            git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
            git add src/dwarf/source_lookup.cpp
            git commit -m 'feat: recover register-relative memory locals'
            git push origin HEAD:feat/dwarf-register-relative-memory-local
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 30
