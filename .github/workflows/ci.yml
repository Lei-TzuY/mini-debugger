name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            cxx_flags: ""
          - compiler: clang-large
            cc: clang
            cxx: clang++
            cxx_flags: -mcmodel=large
    name: build-test (${{ matrix.compiler }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: DWARF5 optimized source-value integration
        run: |
          "$CC" -O1 -g -gdwarf-5 -fPIE tests/fixtures/formal_parameter_fixture.c -pie -o build/formal_parameter_fixture_v5_pie
          "$CC" -O1 -g -gdwarf-5 -fno-pie tests/fixtures/formal_parameter_fixture.c -no-pie -o build/formal_parameter_fixture_v5_nopie
          echo "=== ${CC} DWARF5 info ==="
          readelf --debug-dump=info build/formal_parameter_fixture_v5_nopie | sed -n '1,240p'
          echo "=== ${CC} DWARF5 loclists ==="
          readelf --debug-dump=loc build/formal_parameter_fixture_v5_nopie | sed -n '1,240p'
          build/dwarf_line_integration \
            build/debug_line_fixture_pie \
            build/debugger_fixture_stripped \
            build/debug_line_fixture_v5 \
            build/formal_parameter_fixture_v5_pie
          build/dwarf_line_integration \
            build/debug_line_fixture_nopie \
            build/debugger_fixture_stripped \
            build/debug_line_fixture_v5 \
            build/formal_parameter_fixture_v5_nopie
