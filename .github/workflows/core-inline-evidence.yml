name: core-inline-evidence

on:
  push:
  pull_request:

jobs:
  selected-inline-aggregate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    name: selected-inline-aggregate (${{ matrix.compiler }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Build optimized caller-inline fixtures
        run: |
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_structure_fixture.c \
            -o /tmp/frame-zero-inline-structure-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_structure_fixture.c \
            -o /tmp/frame-zero-inline-structure-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_array_fixture.c \
            -o /tmp/frame-zero-inline-array-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_array_fixture.c \
            -o /tmp/frame-zero-inline-array-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_fbreg_array_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-array-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_fbreg_array_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-array-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_fbreg_union_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-union-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_fbreg_union_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-union-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_fbreg_enum_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-enum-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_fbreg_enum_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-enum-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_fbreg_pointer_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-pointer-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_fbreg_pointer_fixture.c \
            -o /tmp/frame-zero-inline-fbreg-pointer-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_union_fixture.c \
            -o /tmp/frame-zero-inline-union-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_union_fixture.c \
            -o /tmp/frame-zero-inline-union-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_bitfield_fixture.c \
            -o /tmp/frame-zero-inline-bitfield-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_bitfield_fixture.c \
            -o /tmp/frame-zero-inline-bitfield-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_nested_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-nested-aggregate-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_nested_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-nested-aggregate-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_typed_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-typed-aggregate-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_typed_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-typed-aggregate-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/frame_zero_inline_enum_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-enum-aggregate-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/frame_zero_inline_enum_aggregate_fixture.c \
            -o /tmp/frame-zero-inline-enum-aggregate-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/caller_inline_core_fixture.c \
            tests/fixtures/caller_inline_crash_leaf.c -pthread \
            -o /tmp/caller-inline-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/caller_inline_core_fixture.c \
            tests/fixtures/caller_inline_crash_leaf.c -pthread \
            -o /tmp/caller-inline-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/caller_inline_typed_aggregate_fixture.c \
            tests/fixtures/caller_inline_typed_aggregate_crash_leaf.c \
            -o /tmp/caller-inline-typed-aggregate-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/caller_inline_typed_aggregate_fixture.c \
            tests/fixtures/caller_inline_typed_aggregate_crash_leaf.c \
            -o /tmp/caller-inline-typed-aggregate-nopie
          "$CC" -O2 -g -gdwarf-4 -fPIE -pie \
            tests/fixtures/caller_inline_nested_aggregate_fixture.c \
            tests/fixtures/caller_inline_nested_aggregate_crash_leaf.c \
            -o /tmp/caller-inline-nested-aggregate-pie
          "$CC" -O2 -g -gdwarf-4 -fno-pie -no-pie \
            tests/fixtures/caller_inline_nested_aggregate_fixture.c \
            tests/fixtures/caller_inline_nested_aggregate_crash_leaf.c \
            -o /tmp/caller-inline-nested-aggregate-nopie
      - name: Verify compiler-produced inline typed bindings
        run: |
          python3 tests/core_frame_zero_inline_structure_dwarf_oracle.py \
            /tmp/frame-zero-inline-structure-pie
          python3 tests/core_frame_zero_inline_structure_dwarf_oracle.py \
            /tmp/frame-zero-inline-structure-nopie
          python3 tests/core_frame_zero_inline_array_dwarf_oracle.py \
            /tmp/frame-zero-inline-array-pie
          python3 tests/core_frame_zero_inline_array_dwarf_oracle.py \
            /tmp/frame-zero-inline-array-nopie
          python3 tests/core_frame_zero_inline_fbreg_array_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-array-pie
          python3 tests/core_frame_zero_inline_fbreg_array_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-array-nopie
          python3 tests/core_frame_zero_inline_fbreg_union_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-union-pie
          python3 tests/core_frame_zero_inline_fbreg_union_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-union-nopie
          python3 tests/core_frame_zero_inline_fbreg_enum_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-enum-pie
          python3 tests/core_frame_zero_inline_fbreg_enum_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-enum-nopie
          python3 tests/core_frame_zero_inline_fbreg_pointer_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-pointer-pie
          python3 tests/core_frame_zero_inline_fbreg_pointer_dwarf_oracle.py \
            /tmp/frame-zero-inline-fbreg-pointer-nopie
          python3 tests/core_frame_zero_inline_union_dwarf_oracle.py \
            /tmp/frame-zero-inline-union-pie
          python3 tests/core_frame_zero_inline_union_dwarf_oracle.py \
            /tmp/frame-zero-inline-union-nopie
          python3 tests/core_frame_zero_inline_bitfield_dwarf_oracle.py \
            /tmp/frame-zero-inline-bitfield-pie
          python3 tests/core_frame_zero_inline_bitfield_dwarf_oracle.py \
            /tmp/frame-zero-inline-bitfield-nopie
          python3 tests/core_frame_zero_inline_nested_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-nested-aggregate-pie
          python3 tests/core_frame_zero_inline_nested_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-nested-aggregate-nopie
          python3 tests/core_frame_zero_inline_typed_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-typed-aggregate-pie
          python3 tests/core_frame_zero_inline_typed_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-typed-aggregate-nopie
          python3 tests/core_frame_zero_inline_enum_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-enum-aggregate-pie
          python3 tests/core_frame_zero_inline_enum_aggregate_dwarf_oracle.py \
            /tmp/frame-zero-inline-enum-aggregate-nopie
          python3 tests/core_caller_inline_dwarf_oracle.py /tmp/caller-inline-pie
          python3 tests/core_caller_inline_dwarf_oracle.py /tmp/caller-inline-nopie
          python3 tests/core_caller_inline_union_dwarf_oracle.py /tmp/caller-inline-pie
          python3 tests/core_caller_inline_union_dwarf_oracle.py /tmp/caller-inline-nopie
          python3 tests/core_caller_inline_bitfield_dwarf_oracle.py /tmp/caller-inline-pie
          python3 tests/core_caller_inline_bitfield_dwarf_oracle.py /tmp/caller-inline-nopie
          python3 tests/core_caller_inline_enum_dwarf_oracle.py /tmp/caller-inline-pie
          python3 tests/core_caller_inline_enum_dwarf_oracle.py /tmp/caller-inline-nopie
          python3 tests/core_caller_inline_typed_aggregate_dwarf_oracle.py \
            /tmp/caller-inline-typed-aggregate-pie
          python3 tests/core_caller_inline_typed_aggregate_dwarf_oracle.py \
            /tmp/caller-inline-typed-aggregate-nopie
          python3 tests/core_caller_inline_nested_aggregate_dwarf_oracle.py \
            /tmp/caller-inline-nested-aggregate-pie
          python3 tests/core_caller_inline_nested_aggregate_dwarf_oracle.py \
            /tmp/caller-inline-nested-aggregate-nopie
      - name: Build core inspection surface
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target mdbg-core --parallel 2
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_structure_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-structure
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_array_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-array
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_fbreg_array_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-fbreg-array
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_fbreg_union_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-fbreg-union
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_fbreg_enum_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-fbreg-enum
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_fbreg_pointer_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-fbreg-pointer
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_union_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-union
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_bitfield_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-bitfield
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_nested_aggregate_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-nested-aggregate
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_typed_aggregate_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-typed-aggregate
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_frame_zero_inline_enum_aggregate_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-frame-zero-inline-enum-aggregate
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_aggregate_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-aggregate-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_array_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-array-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_union_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-union-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_bitfield_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-bitfield-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_enum_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-enum-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_typed_aggregate_enum_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-typed-aggregate-enum-session
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_nested_aggregate_session_integration.cpp \
            build/libmdbg_core.a -pthread \
            -o /tmp/core-inline-nested-aggregate-session
      - name: Verify selected-inline aggregate session and CLI
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/mdbg-core-%p
          ulimit -c unlimited
          /tmp/core-frame-zero-inline-structure \
            /tmp/frame-zero-inline-structure-pie build/mdbg-core
          /tmp/core-frame-zero-inline-structure \
            /tmp/frame-zero-inline-structure-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-array \
            /tmp/frame-zero-inline-array-pie build/mdbg-core
          /tmp/core-frame-zero-inline-array \
            /tmp/frame-zero-inline-array-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-array \
            /tmp/frame-zero-inline-fbreg-array-pie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-array \
            /tmp/frame-zero-inline-fbreg-array-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-union \
            /tmp/frame-zero-inline-fbreg-union-pie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-union \
            /tmp/frame-zero-inline-fbreg-union-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-enum \
            /tmp/frame-zero-inline-fbreg-enum-pie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-enum \
            /tmp/frame-zero-inline-fbreg-enum-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-pointer \
            /tmp/frame-zero-inline-fbreg-pointer-pie build/mdbg-core
          /tmp/core-frame-zero-inline-fbreg-pointer \
            /tmp/frame-zero-inline-fbreg-pointer-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-union \
            /tmp/frame-zero-inline-union-pie build/mdbg-core
          /tmp/core-frame-zero-inline-union \
            /tmp/frame-zero-inline-union-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-bitfield \
            /tmp/frame-zero-inline-bitfield-pie build/mdbg-core
          /tmp/core-frame-zero-inline-bitfield \
            /tmp/frame-zero-inline-bitfield-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-nested-aggregate \
            /tmp/frame-zero-inline-nested-aggregate-pie build/mdbg-core
          /tmp/core-frame-zero-inline-nested-aggregate \
            /tmp/frame-zero-inline-nested-aggregate-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-typed-aggregate \
            /tmp/frame-zero-inline-typed-aggregate-pie build/mdbg-core
          /tmp/core-frame-zero-inline-typed-aggregate \
            /tmp/frame-zero-inline-typed-aggregate-nopie build/mdbg-core
          /tmp/core-frame-zero-inline-enum-aggregate \
            /tmp/frame-zero-inline-enum-aggregate-pie build/mdbg-core
          /tmp/core-frame-zero-inline-enum-aggregate \
            /tmp/frame-zero-inline-enum-aggregate-nopie build/mdbg-core
          /tmp/core-inline-aggregate-session /tmp/caller-inline-pie build/mdbg-core
          /tmp/core-inline-aggregate-session /tmp/caller-inline-nopie build/mdbg-core
          /tmp/core-inline-array-session /tmp/caller-inline-pie build/mdbg-core
          /tmp/core-inline-array-session /tmp/caller-inline-nopie build/mdbg-core
          /tmp/core-inline-union-session /tmp/caller-inline-pie build/mdbg-core
          /tmp/core-inline-union-session /tmp/caller-inline-nopie build/mdbg-core
          /tmp/core-inline-bitfield-session /tmp/caller-inline-pie build/mdbg-core
          /tmp/core-inline-bitfield-session /tmp/caller-inline-nopie build/mdbg-core
          /tmp/core-inline-enum-session /tmp/caller-inline-pie build/mdbg-core
          /tmp/core-inline-enum-session /tmp/caller-inline-nopie build/mdbg-core
          /tmp/core-inline-typed-aggregate-enum-session \
            /tmp/caller-inline-typed-aggregate-pie build/mdbg-core
          /tmp/core-inline-typed-aggregate-enum-session \
            /tmp/caller-inline-typed-aggregate-nopie build/mdbg-core
          /tmp/core-inline-nested-aggregate-session \
            /tmp/caller-inline-nested-aggregate-pie build/mdbg-core
          /tmp/core-inline-nested-aggregate-session \
            /tmp/caller-inline-nested-aggregate-nopie build/mdbg-core
