name: exec-timeout-diagnostic

on:
  push:
    branches:
      - feat/compiler-double-deref-stack-value

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument topology scenarios in workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/exec_image_integration.cpp')
          s = p.read_text()
          calls = [
            'run_exec_replacement(argv[1], argv[2]);',
            'run_follow_parent_fork(argv[1]);',
            'run_follow_child_fork(argv[1]);',
            'run_two_process_debug_state(argv[1]);',
            'run_follow_parent_vfork(argv[1], argv[2]);',
            'run_cli_exec_replacement(argv[1], argv[2]);',
            'run_cli_follow_parent_fork(argv[1]);',
            'run_cli_follow_parent_vfork(argv[1], argv[2]);',
          ]
          for i, call in enumerate(calls, 1):
              if s.count(call) != 1:
                  raise SystemExit(f'expected one call: {call}')
              marker = f'std::cerr << "[exec-diag] begin {i}: {call[:-1]}\\n" << std::flush;\n    '
              s = s.replace(call, marker + call, 1)
          p.write_text(s)
          PY
      - name: Configure and build focused test
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2 --target exec_image_integration exec_driver_pie exec_target_pie mdbg
      - name: Stress instrumented PIE topology workflow
        shell: bash
        run: |
          set -o pipefail
          for i in $(seq 1 12); do
            echo "=== diagnostic iteration $i ==="
            timeout --signal=KILL 8s ./build/exec_image_integration ./build/exec_driver_pie ./build/exec_target_pie 2>&1 | tee /tmp/exec-diag-$i.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "diagnostic iteration $i failed/status=$status"
              cat /tmp/exec-diag-$i.log
              exit "$status"
            fi
          done
