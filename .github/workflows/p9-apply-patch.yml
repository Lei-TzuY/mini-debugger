name: p9-source-patch

on:
  push:
    branches:
      - feat/compiler-double-deref-stack-value

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish bounded evaluator formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dwarf/source_lookup.cpp')
          text = path.read_text()
          function = text.index('std::uint64_t evaluate_breg5_stack_value(')
          next_function = text.index('std::uint64_t evaluate_breg5_memory_address(', function)
          segment = text[function:next_function]
          needle = '  return value ^ constant;\n  }\n\n'
          if segment.count(needle) != 1:
              raise SystemExit('expected exactly one mis-indented evaluator closing brace')
          segment = segment.replace(needle, '  return value ^ constant;\n}\n\n', 1)
          updated = text[:function] + segment + text[next_function:]
          path.write_text(updated)
          PY
          git diff --check
          git diff -- src/dwarf/source_lookup.cpp
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/dwarf/source_lookup.cpp
          git commit -m "style: finish bounded dereference formatting"
          git push origin HEAD:feat/compiler-double-deref-stack-value
