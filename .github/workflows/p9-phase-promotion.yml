name: p9-phase-promotion

on:
  push:
    branches:
      - feat/compiler-double-deref-stack-value

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record P9 and promote frame-aware contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phase5 = Path('docs/phase-5-roadmap.md')
          text = phase5.read_text()
          marker = '## Current frontier: next compiler-produced expression or ownership failure\n'
          if text.count(marker) != 1:
              raise SystemExit('Phase 5 frontier marker was not unique')
          prefix, _ = text.split(marker, 1)
          tail = '''## Priority 9: compiler double-dereference stack values — complete

The tenth and final bounded Phase 5 slice is selected from a real pointer-to-pointer source workflow rather than by extending the opcode table. The existing indirect local keeps the same observable `indirect_local == 0x8877665544332211`, but receives a `uint64_t**` and computes `**ptr ^ 0x55aa00ff33cc6699`. At `indirect_local_probe`, GCC 13.3 selects the active current-PC expression `DW_OP_breg5 (rdi): 0; DW_OP_deref; DW_OP_deref; DW_OP_constu 6172747335350380185; DW_OP_xor; DW_OP_stack_value`; Clang 18.1.3 materializes the same source value through the already-supported `DW_OP_reg0 (rax)` path.

Completed Priority 9 contract:

- test-first run #721 builds both compiler lanes successfully; GCC PIE and non-PIE fail only in `dwarf5_local_value_integration` when the prior one-dereference evaluator reaches the second `DW_OP_deref`, while the other 46 GCC tests and the complete Clang-large lane remain green;
- the Priority 8 evaluator keeps the same zero-offset `DW_OP_breg5` ownership and exact `DW_OP_constu` / `DW_OP_xor` / trailing `DW_OP_stack_value` suffix, but admits exactly one or two consecutive `DW_OP_deref` operations before that suffix;
- each dereference is one bounded x86-64 8-byte inferior-memory read through the existing `Debugger::read_memory` path using the currently selected stopped TID; a third dereference is rejected before performing a third read;
- the same pre-existing direct API and real CLI assertions prove the unchanged expected value for PIE and non-PIE, so the new capability is a deeper ownership chain rather than a parallel value or presentation path;
- clean production run #728 is fully green under GCC and Clang-large. An earlier unrelated GCC `exec_image_integration_pie` runner timeout was investigated with an instrumented 20-iteration focused topology run plus subsequent ordinary full-suite runs; it was not reproducible and no process-topology semantics were changed to mask it;
- nonzero breg offsets, alternate dereference widths, chains deeper than two, malformed suffixes, arbitrary stack operations, and trailing data remain fail-closed.

Priority 9 does not create an arbitrary pointer-chasing VM. It extends the compiler-proven ownership path from one to two selected-TID inferior-memory loads and keeps every other expression boundary explicit.

## Phase 5 closure

Phase 5 is complete for the current compiler-produced DWARF expression milestone. Priorities 0–9 now cover historical entry ownership, register-relative values, compiler-composed arithmetic, register pieces, register-relative memory, inlined lexical ownership, const-qualified types, and bounded one/two-hop dereference stack values under the permanent GCC and Clang-large lanes.

Further work must not continue by manufacturing Priority 10+ opcode variants. A new expression form may still be added later when it blocks a higher-level executable workflow, but the active architectural frontier moves to frame-aware inspection: source values outside the current live frame require explicit unwind/register/memory ownership rather than another implicit use of the active TID register file.

## Selection rule

Phase 5 is sealed. Preserve the existing fail-closed evaluator and compiler matrix; reopen expression semantics only for a concrete compiler-generated failure required by a higher-level debugger capability. The next active roadmap is `docs/phase-6-roadmap.md`.
'''
          phase5.write_text(prefix + tail)

          phase6 = Path('docs/phase-6-roadmap.md')
          if phase6.exists():
              raise SystemExit('Phase 6 roadmap already exists')
          phase6.write_text('''# Phase 6 roadmap

Phase 6 starts after Phase 5 establishes bounded compiler-produced value evaluation for the live stopped frame. The architectural objective is to separate **execution ownership** (the active process/TID that ptrace may resume or mutate) from **inspection-frame ownership** (a current or caller frame whose PC, module, unwind cursor, registers, memory, type, and lexical scope are used only for source inspection).

The phase must not fake caller-frame values by reading the active TID register file. Any register needed by a non-current frame must come from explicit unwind recovery; memory reads must remain process-domain/TID owned; unsupported or unavailable caller state must fail explicitly.

## Priority 0: caller-frame source-value ownership — current frontier

The first slice must be an executable frame-inspection workflow, not a `frame` command shell. Use a real two-or-more-frame compiler fixture with a caller local or parameter that is visible at a stable callee stop, and prove that inspecting the caller uses an explicit frame context rather than the callee's live register state.

Acceptance criteria:

- introduce an explicit inspection-frame context containing at least the owning process domain/TID, frame PC/module identity, and the bounded unwind register state required by the selected compiler-produced location;
- frame 0 is derived from the actual active stopped TID and remains behaviorally identical to the existing current-frame source-value path;
- at least one real caller frame is derived through the existing bounded unwind/CFI machinery, and a compiler-produced caller local/parameter is recovered with correct module/type/lexical ownership in PIE and non-PIE under the permanent compiler matrix;
- if the selected caller expression requires a register the current CFI cursor does not recover, extend register recovery only for the compiler/CFI evidence required by that fixture or choose an independently valid memory-backed caller value; never substitute the callee's current register;
- real CLI coverage may expose `frame <index>` / frame selection only in the same slice that can successfully inspect a caller value. A presentation-only frame selector is not sufficient;
- changing the inspection frame must not redirect `continue`, `step`, breakpoint displacement, signal delivery, register mutation, or hardware-watchpoint ownership away from the live active TID;
- any resume, process-domain switch, exec/image replacement, detach, or new stop invalidates stale non-current frame contexts before further inspection;
- invalid frame indices, unavailable unwind state, unsupported caller expressions, and cross-domain ambiguity remain deterministic failures.

Priority 0 is not a promise of a complete historical register file or arbitrary post-mortem debugger. It establishes the ownership boundary required before deeper frame-aware locals, arguments, or inline-frame inspection can be added safely.

## Selection rule

Choose a real compiler-produced caller-frame value whose recovery advances inspection semantics and whose required state can be owned explicitly. Do not implement generic frame UI, arbitrary register guessing, or expression opcodes that are not selected by that executable workflow.
''')
          PY
          git diff --check
          git diff -- docs/phase-5-roadmap.md docs/phase-6-roadmap.md
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add docs/phase-5-roadmap.md docs/phase-6-roadmap.md
          git commit -m "docs: seal Phase 5 and promote frame-aware contexts"
          git push origin HEAD:feat/compiler-double-deref-stack-value
