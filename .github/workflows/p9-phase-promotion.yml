name: p9-phase-promotion

on:
  push:
    branches:
      - feat/compiler-double-deref-stack-value

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Seal Phase 5 and promote Phase 6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          phase5 = Path('docs/phase-5-roadmap.md')
          text = phase5.read_text()
          marker = '## Current frontier: next compiler-produced expression or ownership failure\n'
          if text.count(marker) != 1:
              raise SystemExit('Phase 5 frontier marker was not unique')
          prefix, _ = text.split(marker, 1)
          phase5.write_text(prefix + '''## Priority 9: compiler double-dereference stack values — complete

The final bounded Phase 5 slice comes from a real pointer-to-pointer workflow rather than opcode enumeration. The existing `indirect_local` keeps the same observable value but receives a `uint64_t**` and computes `**ptr ^ 0x55aa00ff33cc6699`. At `indirect_local_probe`, GCC 13.3 selects `DW_OP_breg5 (rdi): 0; DW_OP_deref; DW_OP_deref; DW_OP_constu 6172747335350380185; DW_OP_xor; DW_OP_stack_value`; Clang 18.1.3 materializes the same value through the existing direct-register path.

Completed Priority 9 contract:

- test-first run #721 leaves the complete Clang-large lane and the other 46 GCC tests green while GCC PIE/non-PIE fail only when the previous evaluator reaches the second `DW_OP_deref`;
- the evaluator admits exactly one or two consecutive 8-byte dereferences in this compiler-proven expression family, each through `Debugger::read_memory` and the selected stopped TID;
- the same direct API and CLI workflow proves the unchanged expected value for PIE and non-PIE; production run #728 and final branch CI remain green under GCC and Clang-large;
- nonzero breg offsets, alternate widths, chains deeper than two, malformed suffixes, arbitrary stack operations, and trailing data remain fail-closed.

Priority 9 does not create an arbitrary pointer-chasing VM. It only extends the proven ownership chain from one inferior-memory load to two.

## Phase 5 closure

Phase 5 is complete for the current compiler-produced DWARF expression milestone. Priorities 0–9 cover historical entry ownership, register-relative values, compiler-composed arithmetic, register pieces, register-relative memory, inlined lexical ownership, const-qualified types, and bounded one/two-hop dereference stack values under the permanent GCC and Clang-large lanes.

Further work must not manufacture Priority 10+ opcode variants. A new expression form may be reopened only when a higher-level executable workflow produces a concrete compiler-generated failure. The active architectural frontier moves to frame-aware inspection, where caller-frame source values require explicit unwind/register/memory ownership rather than implicit use of the live TID register file.

## Selection rule

Phase 5 is sealed. Preserve the fail-closed evaluator and compiler matrix; the next active roadmap is `docs/phase-6-roadmap.md`.
''')

          phase6 = Path('docs/phase-6-roadmap.md')
          if phase6.exists():
              raise SystemExit('Phase 6 roadmap already exists')
          phase6.write_text('''# Phase 6 roadmap

Phase 6 begins after Phase 5 establishes bounded compiler-produced value evaluation for the live stopped frame. Its architectural goal is to separate **execution ownership** (the active process/TID that ptrace may resume or mutate) from **inspection-frame ownership** (a current or caller frame whose PC, module, unwind cursor, recovered registers, memory, type, and lexical scope are used only for source inspection).

A caller-frame value must never be faked by reading the active callee TID register file. Registers required by non-current frames must come from explicit unwind recovery; inferior-memory reads remain owned by the correct process domain/TID; unavailable state fails explicitly.

## Priority 0: caller-frame source-value ownership — current frontier

The first slice must be an executable frame-inspection workflow, not a presentation-only `frame` command. Select a real two-or-more-frame compiler fixture with a caller local or parameter visible at a stable callee stop and prove caller inspection uses an explicit frame context.

Acceptance criteria:

- introduce an inspection-frame context containing the owning process domain/TID, frame PC/module identity, and bounded recovered register state required by the selected compiler expression;
- frame 0 derives from the actual active stopped TID and stays behaviorally identical to the current-frame source-value path;
- derive at least one real caller through the existing bounded unwind/CFI machinery and recover a compiler-produced caller local/parameter with correct module/type/lexical ownership in PIE and non-PIE under both compiler lanes;
- if the caller expression needs a register not yet recovered by CFI, extend recovery only for evidence required by that fixture; never substitute the callee's current register;
- expose frame selection in the CLI only in the same slice that can successfully inspect a caller value;
- changing the inspection frame must not redirect continue/step, breakpoint displacement, signal delivery, register mutation, or hardware-watchpoint ownership away from the live active TID;
- any resume, process-domain switch, exec/image replacement, detach, or new stop invalidates stale non-current frame contexts;
- invalid frame indices, unavailable unwind state, unsupported caller expressions, and cross-domain ambiguity remain deterministic failures.

Priority 0 establishes the ownership boundary for frame-aware locals; it is not a promise of arbitrary historical register reconstruction or post-mortem debugging.

## Selection rule

Choose a real compiler-produced caller-frame value whose recovery advances inspection semantics and whose required state can be owned explicitly. Do not implement generic frame UI, register guessing, or unrelated expression opcodes.
''')

          Path('.github/workflows/p9-phase-promotion.yml').unlink()
          PY
          git diff --check
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A docs/phase-5-roadmap.md docs/phase-6-roadmap.md .github/workflows/p9-phase-promotion.yml
          git commit -m "docs: seal Phase 5 and promote frame-aware contexts"
          git push origin HEAD:feat/compiler-double-deref-stack-value
