name: phase34-apply-test

on:
  push:
    branches:
      - feat/core-inline-pointer-traversal

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage phase34 test patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply permanent Phase 34 regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/core_inline_dwarf_oracle.py')
          text = path.read_text()

          old = '''        caller_shadow_location_evidence(fixture, records, by_offset)\n        print(\n            "caller-frame inline addr2line chain: "\n'''
          new = '''        caller_shadow_location_evidence(fixture, records, by_offset)\n        pointer_evidence = subprocess.check_output(\n            [sys.executable, "tests/core_caller_inline_dwarf_oracle.py", fixture],\n            text=True,\n            stderr=subprocess.STDOUT,\n        )\n        print(pointer_evidence)\n        print(\n            "caller-frame inline addr2line chain: "\n'''
          if old not in text:
              raise SystemExit('caller evidence insertion point changed')
          text = text.replace(old, new, 1)

          old = '''        mdbg_core = os.environ.get("MDBG_CORE", "build/mdbg-core")\n        output = subprocess.check_output(\n            [mdbg_core, core_path],\n            input=(\n                "bt\\n"\n                "frame 1\\n"\n                "inline\\n"\n                "inline 1\\n"\n                "locals\\n"\n                "print caller_shadow\\n"\n                "inline physical\\n"\n                "locals\\n"\n                "quit\\n"\n            ),\n'''
          new = '''        mdbg_core = os.environ.get("MDBG_CORE", "build/mdbg-core")\n        cxx = os.environ.get("CXX", "c++")\n        session_probe = f"/tmp/mdbg-inline-pointer-session-{os.getpid()}"\n        subprocess.check_output(\n            [\n                cxx, "-std=c++17", "-Wall", "-Wextra", "-Wpedantic", "-Werror",\n                "-Isrc", "tests/core_inline_pointer_session_probe.cpp",\n                "build/libmdbg_core.a", "-pthread", "-o", session_probe,\n            ],\n            text=True,\n            stderr=subprocess.STDOUT,\n        )\n        subprocess.check_output(\n            [session_probe, core_path], text=True, stderr=subprocess.STDOUT\n        )\n        output = subprocess.check_output(\n            [mdbg_core, core_path],\n            input=(\n                "bt\\n"\n                "frame 1\\n"\n                "inline\\n"\n                "inline 1\\n"\n                "locals\\n"\n                "print caller_shadow\\n"\n                "print caller_pointer\\n"\n                "deref caller_pointer\\n"\n                "inline physical\\n"\n                "locals\\n"\n                "quit\\n"\n            ),\n'''
          if old not in text:
              raise SystemExit('caller CLI insertion point changed')
          text = text.replace(old, new, 1)

          old = '''        if "variable caller_shadow" not in selected_output:\n            raise RuntimeError("caller-frame inline catalogue lost caller_shadow ownership")\n        if "!caller_shadow = 0x6b [4-byte signed]" not in selected_output:\n            raise RuntimeError(\n                "caller-frame selected inline context did not materialize caller_shadow as 0x6b"\n            )\n'''
          new = '''        if "variable caller_shadow" not in selected_output:\n            raise RuntimeError("caller-frame inline catalogue lost caller_shadow ownership")\n        if "variable caller_pointer" not in selected_output:\n            raise RuntimeError("caller-frame inline catalogue lost caller_pointer ownership")\n        if "!caller_shadow = 0x6b [4-byte signed]" not in selected_output:\n            raise RuntimeError(\n                "caller-frame selected inline context did not materialize caller_shadow as 0x6b"\n            )\n        if "!caller_pointer = 0x" not in selected_output or "[8-byte unsigned]" not in selected_output:\n            raise RuntimeError(\n                "caller-frame selected inline context did not materialize caller_pointer as an x86-64 pointer"\n            )\n        if "!*caller_pointer = 0x2468ace [4-byte signed]" not in selected_output:\n            raise RuntimeError(\n                "caller-frame selected inline context did not dereference caller_pointer to 0x2468ace"\n            )\n'''
          if old not in text:
              raise SystemExit('caller assertion insertion point changed')
          text = text.replace(old, new, 1)

          old = '''        try:\n            os.remove(fixture)\n        except FileNotFoundError:\n            pass\n'''
          new = '''        try:\n            os.remove(fixture)\n        except FileNotFoundError:\n            pass\n        try:\n            os.remove(f"/tmp/mdbg-inline-pointer-session-{os.getpid()}")\n        except FileNotFoundError:\n            pass\n'''
          position = text.rfind(old)
          if position == -1:
              raise SystemExit('caller cleanup insertion point changed')
          text = text[:position] + new + text[position + len(old):]
          path.write_text(text)
          PY

          git rm .github/workflows/phase34-apply-test.yml
          git config user.name LeiZ
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add tests/core_inline_dwarf_oracle.py
          git commit -m 'test: require selected-inline pointer traversal'
          git push origin HEAD:feat/core-inline-pointer-traversal
