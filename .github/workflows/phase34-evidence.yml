name: phase34-evidence

on:
  push:
    branches:
      - feat/core-inline-pointer-traversal

jobs:
  caller-inline-pointer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    name: caller-inline-pointer (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
      - name: Compile and inspect genuine optimized pointer binding
        run: |
          for mode in pie nopie; do
            if [ "$mode" = pie ]; then
              flags="-fPIE -pie"
            else
              flags="-fno-pie -no-pie"
            fi
            "$CC" -O2 -g -gdwarf-4 $flags \
              tests/fixtures/caller_inline_core_fixture.c \
              tests/fixtures/caller_inline_crash_leaf.c \
              -o "/tmp/caller-inline-$mode"
            python3 tests/core_caller_inline_dwarf_oracle.py "/tmp/caller-inline-$mode"
          done
        env:
          CC: ${{ matrix.cc }}
