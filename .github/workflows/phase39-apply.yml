              "  if (direct_union) {\n    return materialize_selected_inline_union(owner, requested_name,\n                                             *direct_union, memory);\n  }\n  if (direct_array) {\n    return materialize_selected_inline_array(owner, requested_name,\n                                             *direct_array, memory);\n  }\n  auto result =\n")

