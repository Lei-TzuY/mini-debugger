name: phase39-repair

on:
  push:
    branches:
      - feat/selected-inline-union

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded union production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/dwarf/source_lookup.cpp')
          source_text = source.read_text()
          stale = ('  const auto pointee_type = resolve_pointer_pointee_type(dies, type->number);'
                   '  const auto direct_structure =\n')
          repaired = ('  const auto pointee_type = resolve_pointer_pointee_type(dies, type->number);\n'
                      '  const auto direct_structure =\n')
          count = source_text.count(stale)
          if count != 1:
              raise SystemExit(
                  f'src/dwarf/source_lookup.cpp: expected one stale joined declaration, found {count}')
          source.write_text(source_text.replace(stale, repaired, 1))

          path = Path('.github/workflows/core-inline-evidence.yml')
          text = path.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          normalized = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          ) + '\n'
          Path('/tmp/apply-phase39.py').write_text(normalized)
          PY
          python3 /tmp/apply-phase39.py
          git diff --check
          cmake -S . -B build-phase39 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-phase39 --target mdbg-core --parallel 2
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/core_inline_union_session_integration.cpp \
            build-phase39/libmdbg_core.a -pthread \
            -o /tmp/core-inline-union-session
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/dwarf/local_value.hpp src/dwarf/source_lookup.cpp \
            src/dwarf/inline_member.hpp src/snapshot/session.hpp src/cli/core_main.cpp
          git commit -m "feat: add explicit selected-inline union member selection"
          git push origin HEAD:feat/selected-inline-union
