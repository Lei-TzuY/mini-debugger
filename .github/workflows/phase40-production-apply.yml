name: phase40-production-apply

on:
  push:
    branches:
      - feat/core-inline-bitfield
    paths:
      - .github/workflows/phase40-production-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-inline-bitfield
          fetch-depth: 0
      - name: Apply bounded bit-field production patch
        run: python3 .github/scripts/apply_phase40_bitfield.py
      - name: Compile production surface
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target mdbg-core --parallel 2
      - name: Commit production patch and remove construction machinery
        run: |
          rm .github/workflows/apply-bitfield-production.yml
          rm .github/workflows/phase40-production-apply.yml
          rm .github/scripts/apply_phase40_bitfield.py
          git config user.name LeiZ
          git config user.email 52287354+Lei-TzuY@users.noreply.github.com
          git add src/dwarf/local_value.hpp src/dwarf/source_lookup.cpp \
            .github/workflows/apply-bitfield-production.yml \
            .github/workflows/phase40-production-apply.yml \
            .github/scripts/apply_phase40_bitfield.py
          git commit -m "feat: materialize compiler-described bit fields"
          git push origin HEAD:feat/core-inline-bitfield
