name: phase42-construction

on:
  push:
    branches:
      - feat/core-inline-aggregate-enum-member

permissions:
  contents: write

jobs:
  patch-production:
    if: "github.event.head_commit.message != 'feat: compose enum identity through aggregate members'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded Phase 42 production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/dwarf/source_lookup_snapshot_impl.inc",
              "constexpr std::uint8_t kSnapshotDwOpXmm0 =\n    static_cast<std::uint8_t>(kDwOpReg0 + 17U);\n\nstruct SnapshotRegisterPieceSource",
              "constexpr std::uint8_t kSnapshotDwOpXmm0 =\n    static_cast<std::uint8_t>(kDwOpReg0 + 17U);\n\nstd::optional<LocalEnumType> selected_inline_enum_type(\n    const std::vector<Die>& dies, std::uint64_t type_offset);\n\nstruct SnapshotRegisterPieceSource",
          )

          replace_once(
              "src/dwarf/source_lookup_snapshot_impl.inc",
              "    const auto integer = resolve_integer_type(dies, type_offset);\n    if (offset > struct_size || integer.byte_size > struct_size - offset) {\n      throw std::runtime_error(\"snapshot integer structure member exceeds aggregate storage\");\n    }\n    return LocalStructMemberType{member_name->text, offset, integer.byte_size,\n                                 integer.is_signed};",
              "    if (const auto enum_type = selected_inline_enum_type(dies, type_offset)) {\n      if (offset > struct_size || enum_type->byte_size > struct_size - offset) {\n        throw std::runtime_error(\n            \"snapshot enum structure member exceeds aggregate storage\");\n      }\n      LocalStructMemberType result{member_name->text, offset, enum_type->byte_size,\n                                   enum_type->is_signed,\n                                   LocalValueKind::Enumeration};\n      result.enum_type = *enum_type;\n      return result;\n    }\n\n    const auto integer = resolve_integer_type(dies, type_offset);\n    if (offset > struct_size || integer.byte_size > struct_size - offset) {\n      throw std::runtime_error(\"snapshot integer structure member exceeds aggregate storage\");\n    }\n    return LocalStructMemberType{member_name->text, offset, integer.byte_size,\n                                 integer.is_signed};",
          )

          replace_once(
              "src/dwarf/source_lookup.cpp",
              "    result.members.push_back(LocalStructMember{member.name,\n                                               raw,\n                                               member.byte_size,\n                                               member.is_signed,\n                                               member.kind,\n                                               member.pointee_type,\n                                               member.bit_slice});",
              "    result.members.push_back(LocalStructMember{member.name,\n                                               raw,\n                                               member.byte_size,\n                                               member.is_signed,\n                                               member.kind,\n                                               member.pointee_type,\n                                               member.bit_slice,\n                                               member.enum_type});",
          )

          replace_once(
              "src/dwarf/inline_member.hpp",
              "  if (member->kind == LocalValueKind::Integer) {\n    if (member->pointee_type) {\n      throw std::logic_error(\n          \"selected-inline aggregate integer member unexpectedly has pointee metadata\");\n    }\n  } else if (member->kind == LocalValueKind::Pointer) {\n    if (member->byte_size != sizeof(std::uintptr_t) || member->is_signed ||\n        !member->pointee_type || member->pointee_type->byte_size == 0 ||\n        member->pointee_type->byte_size > sizeof(std::uint64_t)) {\n      throw std::logic_error(\n          \"selected-inline aggregate pointer member has invalid bounded pointee metadata\");\n    }\n  } else {\n    throw std::runtime_error(\n        \"selected-inline aggregate member kind is outside the bounded traversal model\");\n  }",
              "  if (member->kind == LocalValueKind::Integer) {\n    if (member->pointee_type || member->enum_type) {\n      throw std::logic_error(\n          \"selected-inline aggregate integer member retained incompatible type metadata\");\n    }\n  } else if (member->kind == LocalValueKind::Pointer) {\n    if (member->byte_size != sizeof(std::uintptr_t) || member->is_signed ||\n        !member->pointee_type || member->enum_type ||\n        member->pointee_type->byte_size == 0 ||\n        member->pointee_type->byte_size > sizeof(std::uint64_t)) {\n      throw std::logic_error(\n          \"selected-inline aggregate pointer member has invalid bounded pointee metadata\");\n    }\n  } else if (member->kind == LocalValueKind::Enumeration) {\n    if (member->pointee_type || member->bit_slice || !member->enum_type ||\n        member->enum_type->byte_size != member->byte_size ||\n        member->enum_type->is_signed != member->is_signed ||\n        member->enum_type->enumerators.empty()) {\n      throw std::logic_error(\n          \"selected-inline aggregate enum member has invalid bounded enum metadata\");\n    }\n  } else {\n    throw std::runtime_error(\n        \"selected-inline aggregate member kind is outside the bounded traversal model\");\n  }",
          )

          replace_once(
              "src/dwarf/inline_member.hpp",
              "  if (member.kind == LocalValueKind::Pointer) {\n    result.pointee_type = LocalPointeeType{\n        member.pointee_type->byte_size, member.pointee_type->is_signed,\n        LocalValueKind::Integer, {}};\n  }\n  return result;",
              "  if (member.kind == LocalValueKind::Pointer) {\n    result.pointee_type = LocalPointeeType{\n        member.pointee_type->byte_size, member.pointee_type->is_signed,\n        LocalValueKind::Integer, {}};\n  } else if (member.kind == LocalValueKind::Enumeration) {\n    result.enum_type = member.enum_type;\n  }\n  return result;",
          )
          PY

          git diff --check
          git diff -- src/dwarf/source_lookup_snapshot_impl.inc src/dwarf/source_lookup.cpp \
            src/dwarf/inline_member.hpp
          git config user.name 'LeiZ'
          git config user.email '52287354+Lei-TzuY@users.noreply.github.com'
          git add src/dwarf/source_lookup_snapshot_impl.inc src/dwarf/source_lookup.cpp \
            src/dwarf/inline_member.hpp
          git commit -m 'feat: compose enum identity through aggregate members'
          git push origin HEAD:feat/core-inline-aggregate-enum-member
